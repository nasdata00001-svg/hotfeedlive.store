name: Hourly Trends Collector & Auto Deploy

on:
  schedule:
    # 매 시간 정각(0분)마다 자동 실행 (UTC 기준)
    - cron: '0 * * * *'
  workflow_dispatch: # 수동 실행 버튼 지원

jobs:
  update-trends:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Trend Collector
        run: |
          python collector.py

      - name: Commit and Push if Changed
        env:
          TZ: Asia/Seoul
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add trends.json trends_data.js sitemap.xml rss.xml og-image.svg archives/
          if [ -f og-image.png ]; then git add og-image.png; fi
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto: Update real-time trends [$(date '+%Y-%m-%d %H:%M:%S KST')]"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Notify Google Indexing API
        if: ${{ secrets.GOOGLE_INDEXING_SA_JSON != '' }}
        env:
          GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
        run: |
          python google_indexing.py --env

      - name: Auto Post to SNS (Telegram / X)
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' || secrets.X_API_KEY != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python sns_poster.py
