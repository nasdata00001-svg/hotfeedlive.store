  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <link rel="stylesheet" href="style.css?v=20261126-4">
  <style>
    .topic-nav { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-primary); font-weight: 600; font-size: 14px; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    .topic-hero { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-card); }
    .topic-title-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; }
    .topic-kicker { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent-primary); background: rgba(79, 70, 229, 0.08); padding: 3px 9px; border-radius: 6px; margin-bottom: 8px; }
    .topic-hero h2 { font-size: 26px; font-weight: 800; color: var(--text-main); word-break: break-word; }
    .topic-subtitle { font-size: 13.5px; color: var(--text-muted); margin-top: 4px; }
    .topic-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .t-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
    .t-btn.active { background: rgba(239, 68, 68, 0.08); border-color: #ef4444; color: #dc2626; }
    .t-btn.alert-active { background: rgba(79, 70, 229, 0.1); border-color: var(--accent-primary); color: var(--accent-primary); }
    .platform-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .p-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); text-decoration: none; }
    .p-chip:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
    .p-chip strong { color: var(--accent-primary); }
    .topic-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-bottom: 20px; }
    .panel-card { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-card); min-width: 0; }
    .panel-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .chart-wrap { width: 100%; overflow-x: auto; }
    .news-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .news-link { display: block; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); text-decoration: none; color: var(--text-main); transition: var(--transition); }
    .news-link:hover { border-color: var(--accent-primary); background: var(--bg-primary); }
    .news-title { font-size: 13.5px; font-weight: 600; line-height: 1.45; }
    .news-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
    .ext-search-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 12px; }
    .ext-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); background: var(--bg-primary); color: var(--text-secondary); text-decoration: none; font-size: 12.5px; font-weight: 600; transition: var(--transition); }
    .ext-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
    .other-topics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .topic-pill { padding: 6px 12px; border-radius: 999px; background: var(--bg-subtle); color: var(--text-secondary); text-decoration: none; font-size: 12.5px; font-weight: 600; transition: var(--transition); }
    .topic-pill:hover { background: rgba(79, 70, 229, 0.1); color: var(--accent-primary); }
    .empty-msg { font-size: 13px; color: var(--text-muted); padding: 14px 0; }
    @media (max-width: 860px) {
      .topic-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <a href="/" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;">
          <div class="logo-badge notranslate" aria-hidden="true">🔥</div>
          <div class="brand-text">
            <h1 class="notranslate">HOTFEED LIVE</h1>
            <p>키워드 이슈 요약 &amp; 시간대별 순위 변동 분석</p>
          </div>
        </a>
      </div>
    </header>

    <div class="topic-nav">
      <a href="/" class="back-link">← 실시간 대시보드로 돌아가기</a>
      <a href="/archive.html" class="back-link">📅 전체 아카이브 보기 →</a>
    </div>

    <section class="topic-hero">
      <div class="topic-title-row">
        <div>
          <span class="topic-kicker">TREND TOPIC REPORT</span>
          <h2 id="topicTitle">키워드 분석 중...</h2>
          <p class="topic-subtitle" id="topicSubtitle">실시간 트렌드 및 시간대별 기록을 집계하고 있습니다.</p>
        </div>
        <div class="topic-actions">
          <button type="button" id="btnTopicLike" class="t-btn">❤️ 관심 있어요 <span id="topicLikeCount">0</span></button>
          <button type="button" id="btnTopicAlert" class="t-btn">🔔 알림 등록</button>
          <button type="button" id="btnTopicShare" class="t-btn">🔗 공유하기</button>
        </div>
      </div>
      <div class="platform-chips" id="platformChips"></div>
    </section>

    <div class="topic-grid">
      <section class="panel-card">
        <h3>📈 시간대별 순위 변동 그래프</h3>
        <div class="chart-wrap" id="rankChartArea">
          <p class="empty-msg">시간대별 순위 데이터를 불러오는 중...</p>
        </div>
      </section>

      <section class="panel-card">
        <h3>📰 관련 뉴스 및 바로 검색</h3>
        <div id="relatedNewsArea">
          <p class="empty-msg">관련 뉴스를 확인하는 중...</p>
        </div>
        <div class="ext-search-grid" id="extSearchGrid"></div>
      </section>
    </div>

    <section class="panel-card">
      <h3>🔥 다른 실시간 주요 키워드</h3>
      <div class="other-topics" id="otherTopics"></div>
    </section>

    <footer>
      <p>© 2026 <span class="notranslate">HOTFEED LIVE (hotfeedlive.store)</span> · <a href="/" style="color:var(--accent-primary);">실시간 대시보드</a> · <a href="/archive.html" style="color:var(--accent-primary);">아카이브</a></p>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toastIcon" class="notranslate" aria-hidden="true">📋</span>
    <span id="toastMsg">알림</span>
  </div>

  <script src="trends_data.js?v=20261126-4"></script>
  <script type="module" src="firebase-analytics.js?v=20261126-4"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    let keyword = (params.get('k') || '').trim();
    const LIKE_KEY = 'hotfeed_likes';
    const ALERT_KEY = 'hotfeed_alert_keywords';

    const topicTitle = document.getElementById('topicTitle');
    const topicSubtitle = document.getElementById('topicSubtitle');
    const platformChips = document.getElementById('platformChips');
    const rankChartArea = document.getElementById('rankChartArea');
    const relatedNewsArea = document.getElementById('relatedNewsArea');
    const extSearchGrid = document.getElementById('extSearchGrid');
    const otherTopics = document.getElementById('otherTopics');
    const btnTopicLike = document.getElementById('btnTopicLike');
    const topicLikeCount = document.getElementById('topicLikeCount');
    const btnTopicAlert = document.getElementById('btnTopicAlert');
    const btnTopicShare = document.getElementById('btnTopicShare');
    const toast = document.getElementById('toast');
    const toastIcon = document.getElementById('toastIcon');
    const toastMsg = document.getElementById('toastMsg');

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function showToast(msg, icon = '📋') {
      toastIcon.textContent = icon;
      toastMsg.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function sendAnalytics(name, payload) {
      if (typeof window.trackAnalyticsEvent === 'function') {
        window.trackAnalyticsEvent(name, payload);
      } else {
        window.__pendingAnalyticsEvents = window.__pendingAnalyticsEvents || [];
        window.__pendingAnalyticsEvents.push({ name, params: payload });
      }
    }

    function readJsonStorage(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key) || 'null') || fallback;
      } catch {
        return fallback;
      }
    }

    function syncLikeUI() {
      const likes = readJsonStorage(LIKE_KEY, {});
      const entry = likes[keyword] || { liked: false, count: 0 };
      btnTopicLike.classList.toggle('active', Boolean(entry.liked));
      topicLikeCount.textContent = entry.count || 0;
    }

    function syncAlertUI() {
      const alerts = readJsonStorage(ALERT_KEY, []);
      const exists = alerts.some(a => a.toLowerCase() === keyword.toLowerCase());
      btnTopicAlert.classList.toggle('alert-active', exists);
      btnTopicAlert.textContent = exists ? '🔔 알림 등록됨' : '🔔 알림 등록';
    }

    function matchKeyword(candidate, target) {
      const a = String(candidate || '').trim().toLowerCase();
      const b = String(target || '').trim().toLowerCase();
      if (!a || !b) return false;
      return a === b || a.includes(b) || b.includes(a);
    }

    function buildExternalSearchLinks(kw) {
      const q = encodeURIComponent(kw);
      const links = [
        { label: '🟢 네이버 검색', url: `https://search.naver.com/search.naver?query=${q}` },
        { label: '🌐 구글 뉴스', url: `https://news.google.com/search?q=${q}&hl=ko&gl=KR` },
        { label: '𝕏 X 실시간', url: `https://x.com/search?q=${q}&f=live` },
        { label: '▶ 유튜브 검색', url: `https://www.youtube.com/results?search_query=${q}` },
      ];
      extSearchGrid.innerHTML = links.map(l =>
        `<a class="ext-btn" href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a>`
      ).join('');
    }

    function renderChart(points) {
      if (!points || points.length === 0) {
        rankChartArea.innerHTML = '<p class="empty-msg">아카이브에 기록된 순위 변동 이력이 아직 없습니다. 매시간 데이터가 쌓이면 자동으로 그래프가 표시됩니다.</p>';
        return;
      }

      const w = 640;
      const h = 220;
      const padL = 42;
      const padR = 24;
      const padT = 22;
      const padB = 34;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;
      const maxRank = Math.max(10, ...points.map(p => p.rank));

      const xFor = (idx) => points.length === 1 ? padL + plotW / 2 : padL + (idx / (points.length - 1)) * plotW;
      const yFor = (rank) => padT + ((rank - 1) / Math.max(1, maxRank - 1)) * plotH;

      let gridHtml = '';
      [1, 3, 5, 10].forEach(r => {
        if (r <= maxRank) {
          const y = yFor(r);
          gridHtml += `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="#e2e8f0" stroke-dasharray="4 4"/>`;
          gridHtml += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#64748b">${r}위</text>`;
        }
      });

      const coords = points.map((p, idx) => ({ x: xFor(idx), y: yFor(p.rank), ...p }));
      const polyline = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');

      const dots = coords.map(c => `
        <circle cx="${c.x}" cy="${c.y}" r="5" fill="#4f46e5" stroke="#fff" stroke-width="2"/>
        <text x="${c.x}" y="${c.y - 10}" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">${c.rank}위</text>
        <text x="${c.x}" y="${h - 10}" text-anchor="middle" font-size="10.5" fill="#64748b">${esc(c.label)}</text>
      `).join('');

      rankChartArea.innerHTML = `
        <svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;display:block;">
          ${gridHtml}
          ${coords.length > 1 ? `<polyline fill="none" stroke="#4f46e5" stroke-width="2.5" points="${polyline}"/>` : ''}
          ${dots}
        </svg>
        <p style="font-size:12px;color:var(--text-muted);margin-top:6px;">최근 ${points.length}개 시간대 기록 기준 · 1위가 그래프 상단입니다.</p>
      `;
    }

    async function loadTopic() {
      let currentData = window.INITIAL_TRENDS || null;
      try {
        const res = await fetch(`trends.json?t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) currentData = await res.json();
      } catch {}

      if (!keyword && currentData) {
        const first = (currentData.platforms?.all?.items || [])[0];
        keyword = first ? first.keyword : '실시간 트렌드';
      }

      topicTitle.textContent = keyword;
      document.title = `${keyword} 이슈 분석 · 순위 변동 | HOTFEED LIVE`;
      const desc = `"${keyword}" 실시간 검색어 플랫폼별 순위, 시간대별 추이 그래프, 관련 뉴스 요약`;
      document.querySelector('meta[name="description"]').setAttribute('content', desc);
      document.getElementById('ogTitle').setAttribute('content', `${keyword} | HOTFEED LIVE 이슈 분석`);
      document.getElementById('ogDesc').setAttribute('content', desc);
      document.getElementById('canonicalLink').setAttribute('href', `https://hotfeedlive.store/topic.html?k=${encodeURIComponent(keyword)}`);

      syncLikeUI();
      syncAlertUI();
      buildExternalSearchLinks(keyword);
      sendAnalytics('view_topic_detail', { keyword: keyword.slice(0, 100) });

      const matches = [];
      const relatedNews = [];
      const seenNewsUrl = new Set();
      const otherList = [];
      const seenOther = new Set();

      if (currentData && currentData.platforms) {
        Object.entries(currentData.platforms).forEach(([key, pinfo]) => {
          if (key === 'all' || !pinfo) return;
          (pinfo.items || []).forEach(item => {
            const kw = item.keyword || '';
            if (!seenOther.has(kw) && kw !== keyword && otherList.length < 18) {
              seenOther.add(kw);
              otherList.push(kw);
            }
            if (matchKeyword(kw, keyword)) {
              matches.push({
                key,
                platform: pinfo.name,
                icon: pinfo.icon || '📌',
                rank: item.rank,
                url: item.url,
                keyword: kw,
              });
              if (Array.isArray(item.news)) {
                item.news.forEach(n => {
                  if (n && n.url && !seenNewsUrl.has(n.url)) {
                    seenNewsUrl.add(n.url);
                    relatedNews.push(n);
                  }
                });
              }
              if (item.url && (key === 'naver' || key === 'news' || key === 'community') && !seenNewsUrl.has(item.url)) {
                seenNewsUrl.add(item.url);
                relatedNews.push({ title: kw, source: pinfo.name, url: item.url });
              }
            }
          });
        });
      }

      if (matches.length > 0) {
        topicSubtitle.textContent = `현재 ${matches.length}개 플랫폼 실시간 순위에 올라 있습니다 (${currentData.updated_at || ''} KST 기준).`;
        platformChips.innerHTML = matches.map(m => `
          <a class="p-chip" href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">
            <span>${esc(m.icon)} ${esc(m.platform)}</span>
            <strong>${esc(m.rank)}위</strong>
          </a>
        `).join('');
      } else {
        topicSubtitle.textContent = '현재 TOP 순위 목록에는 없으나 과거 기록 및 외부 검색 결과를 확인할 수 있습니다.';
        platformChips.innerHTML = '';
      }

      if (relatedNews.length > 0) {
        relatedNewsArea.innerHTML = `<ul class="news-list">${relatedNews.slice(0, 6).map(n => `
          <li>
            <a class="news-link" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">
              <div class="news-title">${esc(n.title)}</div>
              ${n.source ? `<div class="news-meta">${esc(n.source)}</div>` : ''}
            </a>
          </li>
        `).join('')}</ul>`;
      } else {
        relatedNewsArea.innerHTML = '<p class="empty-msg">연결된 기사 메타가 아직 없습니다. 아래 바로 검색 버튼을 이용하세요.</p>';
      }

      otherTopics.innerHTML = otherList.map(kw =>
        `<a class="topic-pill" href="topic.html?k=${encodeURIComponent(kw)}"># ${esc(kw)}</a>`
      ).join('');

      // Load archive history for chart
      try {
        const idxRes = await fetch(`archives/index.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!idxRes.ok) throw new Error('no index');
        const index = await idxRes.json();
        const snapshots = [];
        Object.keys(index).sort().forEach(date => {
          (index[date] || []).forEach(hour => snapshots.push({ date, hour }));
        });
        const recent = snapshots.slice(-12);
        const fetched = await Promise.all(
          recent.map(async s => {
            try {
              const r = await fetch(`archives/${s.date}/${s.hour}.json`);
              if (!r.ok) return null;
              return { ...s, data: await r.json() };
            } catch {
              return null;
            }
          })
        );

        const points = [];
        fetched.filter(Boolean).forEach(snap => {
          let bestRank = null;
          Object.entries(snap.data.platforms || {}).forEach(([k, p]) => {
            if (k === 'all' || !p) return;
            (p.items || []).forEach(it => {
              if (matchKeyword(it.keyword, keyword)) {
                const r = Number(it.rank);
                if (Number.isFinite(r) && (bestRank === null || r < bestRank)) {
                  bestRank = r;
                }
              }
            });
          });
          if (bestRank !== null) {
            points.push({ label: `${snap.date.slice(5)} ${snap.hour}시`, rank: bestRank });
          }
        });
        renderChart(points);
      } catch {
        renderChart([]);
      }
    }

    btnTopicLike.addEventListener('click', () => {
      const likes = readJsonStorage(LIKE_KEY, {});
      const cur = likes[keyword] || { liked: false, count: 0 };
      const nextLiked = !cur.liked;
      const nextCount = Math.max(0, (cur.count || 0) + (nextLiked ? 1 : -1));
      likes[keyword] = { liked: nextLiked, count: nextCount };
      localStorage.setItem(LIKE_KEY, JSON.stringify(likes));
      syncLikeUI();
      sendAnalytics('like_keyword', { keyword: keyword.slice(0, 100), liked: nextLiked });
      showToast(nextLiked ? '❤️ 관심 키워드에 공감했습니다!' : '관심 공감을 취소했습니다.', nextLiked ? '❤️' : '💬');
    });

    btnTopicAlert.addEventListener('click', () => {
      let alerts = readJsonStorage(ALERT_KEY, []);
      const exists = alerts.some(a => a.toLowerCase() === keyword.toLowerCase());
      if (exists) {
        alerts = alerts.filter(a => a.toLowerCase() !== keyword.toLowerCase());
        localStorage.setItem(ALERT_KEY, JSON.stringify(alerts));
        syncAlertUI();
        showToast('알림 목록에서 제거했습니다.', '🔕');
      } else {
        alerts.push(keyword);
        localStorage.setItem(ALERT_KEY, JSON.stringify(alerts));
        syncAlertUI();
        sendAnalytics('subscribe_keyword_alert', { keyword: keyword.slice(0, 100) });
        showToast(`🔔 "${keyword}" 알림이 등록되었습니다!`, '🔔');
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission().catch(() => {});
        }
      }
    });

    btnTopicShare.addEventListener('click', async () => {
      const shareUrl = `https://hotfeedlive.store/topic.html?k=${encodeURIComponent(keyword)}`;
      if (navigator.share) {
        try {
          await navigator.share({ title: `${keyword} | HOTFEED LIVE`, url: shareUrl });
          return;
        } catch {}
      }
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(shareUrl).catch(() => {});
      }
      showToast('공유 링크가 복사되었습니다!', '🔗');
    });

    loadTopic();
  </script>
</body>
</html>
